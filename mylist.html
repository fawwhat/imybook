<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iMyBook - My Reading List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- navigation bar (same on both pages) -->
  <header class="topbar">
    <h1 class="logo">iMyBook</h1>
    <nav>
      <a href="index.html">Discover Books</a>
      <a href="mylist.html" class="active">My Reading List</a>
    </nav>
  </header>
  <div class="spines"></div>

  <main>

    <!-- CREATE -->
    <section class="card">
      <h2>Add a book to my list</h2>
      <p class="hint">You can also add books from the Discover page. Fields with * must be filled in.</p>

      <div class="form-row">
        <div class="grow">
          <label for="titleInput">Title *</label>
          <input type="text" id="titleInput" placeholder="Book title">
        </div>
        <div class="grow">
          <label for="authorInput">Author *</label>
          <input type="text" id="authorInput" placeholder="Author name">
        </div>
        <div>
          <label for="pagesInput">Total pages *</label>
          <input type="number" id="pagesInput" min="1">
        </div>
        <div>
          <label for="perDayInput">Pages per day</label>
          <input type="number" id="perDayInput" min="1" value="20">
        </div>
        <div>
          <label for="statusInput">Status</label>
          <select id="statusInput">
            <option value="Want to Read">Want to Read</option>
            <option value="Reading">Reading</option>
            <option value="Finished">Finished</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="grow">
          <label for="notesInput">Notes (optional)</label>
          <input type="text" id="notesInput" placeholder="e.g. borrowed from library">
        </div>
        <button id="addBookBtn" class="btn primary">Add Book</button>
      </div>

      <div id="message" class="message hidden"></div>
    </section>

    <!-- READ -->
    <section class="card">
      <h2>My reading list</h2>

      <div id="listMessage" class="message hidden"></div>

      <div id="statsBox" class="stats"></div>

      <div class="form-row">
        <div class="grow">
          <label for="filterText">Search in my list</label>
          <input type="text" id="filterText" placeholder="Type a title or author">
        </div>
        <div>
          <label for="filterStatus">Show</label>
          <select id="filterStatus">
            <option value="All">All books</option>
            <option value="Want to Read">Want to Read</option>
            <option value="Reading">Reading</option>
            <option value="Finished">Finished</option>
          </select>
        </div>
      </div>

      <div id="bookList"></div>
    </section>

  </main>

  <script src="storage.js"></script>
  <script src="mylist.js"></script>
</body>
</html>
